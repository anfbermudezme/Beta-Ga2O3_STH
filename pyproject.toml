[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ga2o3-defect-dichroism"
version = "0.2.1"
description = "Readable CRYSTAL23 and Python helpers for beta-Ga2O3 defect dichroism reproducibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Felipe Bermudez Mendoza" }
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ga2o3d = "ga2o3dichroism.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ga2o3dichroism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Repository = "https://github.com/anfbermudezme/ga2o3-defect-dichroism"
Preprint = "https://www.researchsquare.com/article/rs-9008105/v1"
